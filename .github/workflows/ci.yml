name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Nessun database in CI: i comandi artisan non devono toccare cache/sessioni su sqlite
env:
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, pcntl
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Validate composer.json
        run: composer validate --strict

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --error-format=github

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend assets (Vite manifest richiesto dai test)
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Tests
        run: composer test

  frontend:
    name: Frontend (Biome, tsc, Vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, pcntl
          coverage: none
          tools: composer:v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Biome
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Vitest
        run: bun run test

      - name: Build
        run: bun run build

  generated-types:
    name: Generated types in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, pcntl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Regenerate Ziggy and TypeScript types
        run: |
          php artisan ziggy:generate
          php artisan typescript:transform

      - name: Fail on drift
        run: git diff --exit-code -- resources/js/ziggy.js resources/js/ziggy.d.ts resources/js/types/generated/index.ts

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Composer audit
        run: composer audit --locked

      - name: Bun audit
        run: bun audit
